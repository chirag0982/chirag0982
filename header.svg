<svg viewBox="0 0 1500 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="55%" stop-color="#152238"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        from="-600 0" to="1800 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#94A3B8" fill-opacity="0.10"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="1.1s" fill="freeze"/>
    <rect width="1500" height="220" fill="url(#bg)"/>
    <rect width="1500" height="220" fill="url(#dots)"/>
    <rect width="1500" height="220" fill="url(#glow)"/>
    <path d="M0,190 C 260,150 420,225 750,195 C 1080,165 1240,225 1500,185 L1500,220 L0,220 Z"
          fill="#0B1220" opacity="0.55"/>
    <circle cx="120" cy="46" r="2.5" fill="#38BDF8" fill-opacity="0.7"/>
    <circle cx="1380" cy="46" r="2.5" fill="#38BDF8" fill-opacity="0.7"/>
    <line x1="60" y1="46" x2="105" y2="46" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1.5"/>
    <line x1="1395" y1="46" x2="1440" y2="46" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="750" y="112" text-anchor="middle"
          font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-size="66" font-weight="700" letter-spacing="4"
          fill="#F8FAFC">
      CHIRAG JAIN
    </text>
    <text x="750" y="112" text-anchor="middle"
          font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-size="66" font-weight="700" letter-spacing="4"
          fill="url(#shimmer)">
      CHIRAG JAIN
    </text>
    <rect x="560" y="132" width="380" height="1.5" fill="url(#accent)"/>
    <text x="750" y="164" text-anchor="middle"
          font-family="'JetBrains Mono', 'Courier New', monospace"
          font-size="19" letter-spacing="2.5"
          fill="#94A3B8">
      AI ENGINEER  ·  AGENTIC SYSTEMS  ·  BACKEND &amp; CLOUD
    </text>
  </g>
</svg>
